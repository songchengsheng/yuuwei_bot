name: AI Code Quality Gate (Vue + Java)

on:
  pull_request:
    branches: [ "main", "master", "develop" ]

jobs:
  # 1. 前端 Vue 质量门禁
  frontend-check:
    name: Vue Build & Lint Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend # 如果前端在根目录，请改为 ./
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json
      - name: Install Dependencies
        run: npm ci
      - name: Run ESLint (代码规范检查)
        run: npm run lint --if-present
      - name: Run Type-Check & Build (打包验证)
        run: npm run build

  # 2. 后端 Java 质量门禁
  backend-check:
    name: Java Maven Build & Unit Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend # 如果后端在根目录，请改为 ./
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17' # 根据你的项目修改为 8、17 或 21
          distribution: 'temurin'
          cache: 'maven'
      - name: Build and Run JUnit Tests
        run: mvn -B test package --file pom.xml
